name: 🔥 朱雀テクニカル神託

on:
  schedule:
    # 米市場引け後 朝7:00 JST = 22:00 UTC 前日（平日のみ）
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # 手動実行可

permissions:
  contents: write

jobs:
  suzaku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install yfinance pandas lxml requests pandas-datareader

      - name: 朱雀降臨（テクニカル合議）
        run: python scripts/suzaku_scan.py

      - name: 白虎降臨（米国インサイダー判定）
        run: python scripts/byakko_scan.py
        continue-on-error: true

      - name: 🇯🇵 日本版白虎降臨（半導体テーマ株）
        run: python scripts/jp_byakko_scan.py
        continue-on-error: true

      - name: 玄武降臨（業績モメンタム）
        run: python scripts/genbu_scan.py
        continue-on-error: true

      - name: 青龍降臨（言霊・アナリスト合議）
        run: python scripts/seiryu_scan.py
        continue-on-error: true

      - name: フル神宮合議（朱雀×白虎×玄武×青龍）
        run: python scripts/suzaku_scan.py

      - name: 神託奉納（commit & push）
        run: |
          git config user.name "Jingu Bot"
          git config user.email "jingu@kabu-jingu.bot"
          git add docs/signals.json docs/byakko_data.json docs/jp_byakko_data.json docs/genbu_data.json docs/seiryu_data.json docs/filtered_universe.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "⛩️ 神託 $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
